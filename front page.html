<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueSmart · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #eef2ff;
      --accent: #8b5cf6;
      --danger: #ef4444;
      --dark: #1e293b;
      --gray: #64748b;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
      --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 24px rgba(0,0,0,0.08);
      --radius-sm: 12px;
      --radius: 20px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #f8fafc 0%, #eef2ff 100%);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .auth-wrapper {
      max-width: 460px;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .auth-logo i {
      font-size: 3rem;
      color: var(--primary);
      background: white;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--primary-light);
    }

    .auth-logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .auth-logo p {
      color: var(--gray);
      font-size: 0.95rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
      letter-spacing: 0.01em;
    }

    input {
      width: 100%;
      padding: 0.85rem 1.2rem;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius-sm);
      background: white;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.15s ease;
      color: var(--dark);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .error-message {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.3rem;
      display: none;
      font-weight: 500;
    }

    .error-message.show {
      display: block;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      line-height: 1.4;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.3);
    }

    .btn-block {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
    }

    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--gray);
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .register-link a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-logo">
    <i class="fas fa-people-arrows"></i>
    <h1>QueueSmart</h1>
    <p>IT Help Desk · Queue Management</p>
  </div>

  <div class="card">
    <h2>Welcome back 👋</h2>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">
          <i class="fas fa-envelope" style="color: var(--primary); margin-right: 0.3rem;"></i>
          Email (username)
        </label>
        <input type="email" id="loginEmail" placeholder="you@university.edu" required maxlength="254" autocomplete="email">
        <div class="error-message" id="loginEmailError">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label for="loginPassword">
          <i class="fas fa-lock" style="color: var(--primary); margin-right: 0.3rem;"></i>
          Password
        </label>
        <input type="password" id="loginPassword" placeholder="••••••••" required minlength="6" autocomplete="current-password">
        <div class="error-message" id="loginPasswordError">Password must be at least 6 characters.</div>
      </div>

      <div class="form-group"><label for="demo-role">Demo role</label><select id="demo-role" style="width:100%;padding:12px;font:inherit"><option value="student">Student</option><option value="staff">Admin / Staff</option></select></div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-sign-in-alt"></i> Log in
      </button>
    </form>

    <p class="register-link">
      UI demo: use any valid email and a password of at least 6 characters. No account is created and the password is not stored.
    </p>
  </div>
</div>

<script src="js/validation.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('loginEmail');
    const password = document.getElementById('loginPassword');
    const emailError = document.getElementById('loginEmailError');
    const passwordError = document.getElementById('loginPasswordError');
    let valid = true;

    email.value = email.value.trim();
    const emailProblem = Validate.email(email.value);
    if (emailProblem) {
      emailError.textContent = emailProblem;
      emailError.classList.add('show');
      valid = false;
    } else {
      emailError.classList.remove('show');
    }

    if (!password.value || password.value.length < 6) {
      passwordError.classList.add('show');
      valid = false;
    } else {
      passwordError.classList.remove('show');
    }

    if (valid) {
      const role = document.getElementById('demo-role').value;
      const address = email.value.trim().toLowerCase();
      sessionStorage.setItem('queuesmart.session', JSON.stringify({id:address, name:address.split('@')[0], role}));
      location.href = role === 'staff' ? 'admin.html' : 'user-dashboard.html';
     
    }
  });
</script>

</body>
</html>
