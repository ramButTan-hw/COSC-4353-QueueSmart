<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue History | QueueSmart</title>
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="user-dashboard.html">QueueSmart</a>
    <nav class="nav" aria-label="Student navigation">
      <a class="" href="user-dashboard.html">Dashboard</a>
      <a class="" href="join-queue.html">Join Queue</a>
      <a class="" href="queue-status.html">Queue Status</a>
      <a class="active" href="history.html">History</a>
    </nav>
    <div class="user-area">
      <span class="user-label">Student</span>
      <div id="bell-mount"></div>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-heading">
    <div>
      <h1>Queue History</h1>
      <p>Review your previously joined queues and their outcomes.</p>
    </div>
  </div>
  <section class="card">
    <form id="history-filter" novalidate style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px">
      <div><label for="history-from">From</label><br><input type="date" id="history-from"></div>
      <div><label for="history-to">To</label><br><input type="date" id="history-to"></div>
      <button type="button" class="btn btn-secondary" id="history-clear">Clear</button>
      <div id="history-filter-error" role="alert" class="small" style="flex-basis:100%;color:#b91c1c"></div>
    </form>
    <div class="history-row" style="font-weight:700">
      <div>Service / Date</div>
      <div>Outcome</div>
    </div>
    <div id="history-list"></div>
  </section>
</main>

<script src="js/session.js"></script>
<script src="js/store.js"></script>
<script src="js/notifications.js"></script>
<script>initNotifications();</script>
<script src="js/validation.js"></script>
<script src="js/user.js"></script>
</body>
</html>
